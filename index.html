<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f1a">
    <meta name="description" content="Isometric 8-bit Marine recruit training.">
    <title>8-bit Bootcamp 2</title>
    <link rel="icon" href="/favicon.ico" sizes="32x32">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>
      try {
        if (localStorage.getItem('bootcamp-telemetry') === 'off') {
          localStorage.setItem('umami.disabled', '1');
        }
      } catch (err) { /* storage blocked */ }
    </script>
    <script defer src="https://cloud.umami.is/script.js" data-website-id="7761c1c3-0355-41f9-8c3b-64e35b038a66"></script>
    <style>
      @font-face {
        font-family: 'Press Start 2P';
        src: url('/fonts/press-start-2p-latin-400.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --pixel-font: 'Press Start 2P', monospace;
        --panel-bg: #1e1e32;
        --panel-border: #0a0a14;
        --accent: #6a8cff;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f0f1a;
        color: #e8e8f0;
      }
      canvas { display: block; }

      /* Game canvas renders at low internal resolution and upscales with hard pixels */
      .game-canvas {
        width: 100vw !important;
        height: 100vh !important;
        image-rendering: pixelated;
      }

      .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 8, 20, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .menu-panel {
        background: var(--panel-bg);
        border: 4px solid var(--panel-border);
        box-shadow: 0 0 0 4px #3d3d5c, 8px 8px 0 rgba(0, 0, 0, 0.5);
        padding: 24px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .menu-title {
        margin: 0 0 12px;
        font-family: var(--pixel-font);
        font-size: 1.1rem;
        line-height: 1.5;
        letter-spacing: 0.02em;
        text-align: center;
        color: #ffd94a;
        text-shadow: 3px 3px 0 #000;
      }

      .menu-subtitle {
        margin: 0 0 20px;
        text-align: center;
        color: #9898b0;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.6;
      }

      .menu-hint {
        margin: 16px 0 0;
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        line-height: 1.8;
        color: #f4f4fa;
        text-align: center;
        -webkit-font-smoothing: none;
      }

      .privacy-link {
        color: #f4f4fa;
        text-decoration: none;
      }

      .privacy-link:hover,
      .privacy-link:focus {
        color: #ffd94a;
      }

      .slot-panel { width: min(420px, 92vw); }
      .slot-panel .menu-subtitle {
        color: #f4f4fa;
        font-size: 0.7rem;
        -webkit-font-smoothing: none;
      }

      .slot-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .slot-row {
        display: flex;
        align-items: stretch;
        gap: 10px;
      }

      .slot-row--focused .slot-card {
        border-color: var(--accent);
      }

      .slot-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        flex: 1;
        padding: 14px 16px;
        background: #282840;
        border: 3px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
        color: inherit;
        cursor: pointer;
        text-align: left;
        font: inherit;
      }

      .slot-card:hover,
      .slot-card:focus {
        border-color: var(--accent);
        outline: none;
      }

      .slot-reset-btn {
        align-self: center;
        flex-shrink: 0;
        padding: 10px 12px;
        font-size: 0.5rem;
      }

      .slot-card--empty .slot-name { color: #ffffff; }

      .slot-label {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #f4f4fa;
        text-transform: uppercase;
        -webkit-font-smoothing: none;
      }
      .slot-name {
        font-family: var(--pixel-font);
        font-size: 0.8rem;
        line-height: 1.5;
        color: #ffffff;
        -webkit-font-smoothing: none;
      }
      .slot-meta { font-size: 0.85rem; color: #f4f4fa; }

      .builder-panel {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 24px;
        width: min(820px, 96vw);
        max-height: 92vh;
      }

      .builder-preview {
        background: #12122a;
        border: 3px solid var(--panel-border);
        min-height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .builder-preview canvas { image-rendering: pixelated; }

      .builder-form { min-width: 0; }

      .builder-form h2 {
        margin-top: 0;
        text-align: left;
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        color: #ffd94a;
        text-shadow: 2px 2px 0 #000;
      }

      .field {
        display: block;
        margin-bottom: 14px;
        border: none;
        padding: 0;
      }

      .field > span:first-child,
      .field legend {
        display: block;
        font-size: 0.8rem;
        color: #9898b0;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .field legend { margin-bottom: 8px; }

      .field label { margin-right: 12px; cursor: pointer; }

      .name-row { display: flex; gap: 8px; }
      .name-row input { flex: 1; }

      input[type="text"],
      input[type="range"] { width: 100%; }

      input[type="text"] {
        padding: 8px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: inherit;
        font: inherit;
      }

      input[type="text"]:focus { border-color: var(--accent); outline: none; }

      .field-error {
        display: block;
        color: #ff6b6b;
        font-size: 0.8rem;
        min-height: 1.2em;
        margin-top: 4px;
      }

      .swatch-row, .outfit-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .swatch {
        width: 28px;
        height: 28px;
        border: 3px solid var(--panel-border);
        cursor: pointer;
        padding: 0;
      }

      .swatch--selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

      .background-list { display: flex; flex-direction: column; gap: 6px; }

      .background-option {
        display: block;
        padding: 8px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        cursor: pointer;
      }

      .background-option--selected { border-color: var(--accent); }

      .background-option input { margin-right: 8px; }

      .background-name { font-weight: 600; display: block; }
      .background-desc { font-size: 0.85rem; color: #9898b0; display: block; margin-top: 2px; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .stat-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .stat-meta {
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        color: #9898b0;
      }

      .stat-meta--points { color: #ffd94a; }

      .stat-hint {
        margin: 0 0 10px;
        font-size: 0.75rem;
        color: #686880;
        line-height: 1.4;
      }

      .btn-compact {
        padding: 8px 12px;
        font-size: 0.5rem;
      }

      .stat-row {
        background: #282840;
        padding: 6px 4px;
        border: 2px solid var(--panel-border);
        text-align: center;
        cursor: help;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .stat--str { border-color: var(--accent); }

      .stat-label { display: block; font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; }

      .stat-controls {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .stat-btn {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 2px solid var(--panel-border);
        background: #1e1e32;
        color: #e8e8f0;
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        line-height: 1;
        cursor: pointer;
      }

      .stat-btn:hover:not(:disabled) { border-color: var(--accent); background: #323258; }
      .stat-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      .stat-value {
        display: block;
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        min-width: 1.4em;
        text-align: center;
      }

      .stat-bg-mod {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #6a8cff;
      }

      .hint { font-size: 0.7rem; color: #686880; text-transform: none; font-weight: normal; }

      .outfit-btn {
        padding: 6px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: inherit;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .outfit-btn--selected { border-color: var(--accent); background: #323258; }

      .builder-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .btn {
        padding: 12px 16px;
        border: 3px solid var(--panel-border);
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
        cursor: pointer;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.4;
      }

      .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }

      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .btn-primary { background: #4a6cff; color: #fff; flex: 1; }
      .btn-primary:hover:not(:disabled) { background: #5a7cff; }

      .btn-secondary { background: #3d3d5c; color: #e8e8f0; }
      .btn-secondary:hover { background: #4d4d6c; }

      .btn-danger { background: #c0392b; color: #fff; }
      .btn-danger:hover { background: #e74c3c; }

      .confirm-overlay { z-index: 10001; }

      .confirm-box {
        background: var(--panel-bg);
        border: 4px solid var(--panel-border);
        box-shadow: 0 0 0 4px #3d3d5c, 8px 8px 0 rgba(0, 0, 0, 0.5);
        padding: 24px;
        max-width: 360px;
        text-align: center;
      }

      .confirm-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

      .recruit-hud {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 20, 40, 0.92);
        border: 3px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
        padding: 10px 14px;
        z-index: 9999;
        min-width: 190px;
      }

      .recruit-hud-name {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        line-height: 1.4;
        color: #ffd94a;
        margin-bottom: 4px;
      }
      .recruit-hud-meta { font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; margin-bottom: 8px; }

      .recruit-hud-stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .recruit-stat {
        text-align: center;
        cursor: help;
        padding: 3px 4px;
        background: rgba(40, 40, 64, 0.9);
        border: 2px solid var(--panel-border);
      }

      .recruit-stat-label { display: block; font-family: var(--pixel-font); font-size: 0.4rem; color: #9898b0; }
      .recruit-stat-value { display: block; font-family: var(--pixel-font); font-size: 0.6rem; margin-top: 3px; }

      .location-hud {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #cfcfe0;
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        line-height: 1.5;
        background: rgba(20, 20, 40, 0.85);
        border: 2px solid var(--panel-border);
        padding: 6px 10px;
        z-index: 9999;
      }

      .recruiter-panel { width: min(520px, 94vw); }
      .recruiter-panel--asvab { width: min(720px, 96vw); }
      .recruiter-panel--station { width: min(720px, 96vw); }

      .recruiter-body { margin: 16px 0; min-height: 120px; }
      .recruiter-panel--asvab .recruiter-body { min-height: 280px; }
      .recruiter-panel--station .recruiter-body { min-height: 320px; }

      .recruiter-actions { display: flex; gap: 10px; justify-content: center; }

      .recruiter-copy { margin: 0 0 12px; line-height: 1.5; color: #cfcfe0; }
      .recruiter-copy--small { font-size: 0.8rem; color: #9898b0; }

      .recruiter-checklist {
        margin: 0 0 16px;
        padding-left: 20px;
        color: #cfcfe0;
        line-height: 1.6;
      }

      .asvab-question {
        font-size: 0.9rem;
        line-height: 1.45;
        margin: 0 0 12px;
        color: #2a2a32;
        font-family: 'Courier New', Courier, monospace;
      }

      .asvab-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .asvab-choice {
        text-align: left;
        width: 100%;
      }

      /* --- ASVAB folding-table scene --- */
      .asvab-scene { width: 100%; }

      .asvab-room {
        display: grid;
        grid-template-columns: 1fr 130px;
        gap: 8px;
        align-items: end;
        background: linear-gradient(180deg, #9aa0a8 0%, #7a8088 100%);
        border: 3px solid var(--panel-border);
        padding: 12px 12px 0;
        min-height: 260px;
        image-rendering: pixelated;
      }

      .asvab-table-unit {
        position: relative;
        padding-bottom: 8px;
      }

      .folding-table {
        position: relative;
        margin-bottom: -4px;
      }

      .folding-table-top {
        height: 10px;
        background: #6e757d;
        border: 2px solid #4a5058;
        box-shadow: inset 0 2px 0 #8a929a;
      }

      .folding-table-legs {
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
      }

      .folding-leg {
        display: block;
        width: 4px;
        height: 52px;
        background: #5a6068;
        border: 1px solid #3a4048;
      }

      .asvab-paper {
        position: relative;
        background: #f2ecd8;
        border: 2px solid #c8bfa8;
        box-shadow: 2px 2px 0 #8a8070, inset 0 0 0 1px #fff8e8;
        padding: 10px 12px 8px;
        margin-top: 0;
        min-height: 180px;
        transform: rotate(-0.4deg);
      }

      .asvab-paper-header {
        display: flex;
        justify-content: space-between;
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #5a5040;
        border-bottom: 2px dashed #c0b898;
        padding-bottom: 6px;
        margin-bottom: 10px;
      }

      .asvab-paper-footer {
        margin: 10px 0 0;
        font-size: 0.65rem;
        color: #8a7060;
        font-style: italic;
      }

      .asvab-bubbles {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .asvab-bubble {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 5px 6px;
        border: none;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: #2a2a32;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
      }

      .asvab-bubble:hover { background: rgba(200, 80, 60, 0.08); }

      .asvab-bubble-mark {
        width: 14px;
        height: 14px;
        border: 2px solid #3a3530;
        border-radius: 50%;
        flex-shrink: 0;
        background: #f2ecd8;
      }

      .asvab-bubble--filled .asvab-bubble-mark {
        background: #c84838;
        box-shadow: inset 0 0 0 2px #a03028;
      }

      .asvab-bubble-letter {
        font-weight: 700;
        min-width: 1.2em;
      }

      .asvab-crayon {
        position: absolute;
        right: 12px;
        bottom: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        transform: rotate(12deg);
        pointer-events: none;
      }

      .asvab-crayon-body {
        display: block;
        width: 10px;
        height: 36px;
        background: linear-gradient(90deg, #a83828 0%, #d05040 40%, #a83828 100%);
        border: 1px solid #782018;
        clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
      }

      .asvab-crayon-label {
        font-family: var(--pixel-font);
        font-size: 0.35rem;
        color: #5a4040;
        letter-spacing: 0.05em;
      }

      .asvab-recruit-seat {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 4px;
      }

      .asvab-chair-back {
        width: 52px;
        height: 28px;
        background: #4a5058;
        border: 2px solid #2a3038;
        margin-bottom: -6px;
        z-index: 0;
      }

      .asvab-recruit-slot {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 160px;
      }

      .asvab-recruit-slot canvas {
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.35));
      }

      /* --- NCO recruiting station scene --- */
      .station-scene { width: 100%; }

      .station-room {
        position: relative;
        height: 200px;
        background: linear-gradient(180deg, #c8ccd4 0%, #a8acb4 55%, #8a6f47 55%, #6d5637 100%);
        border: 3px solid var(--panel-border);
        margin-bottom: 12px;
        overflow: hidden;
      }

      .station-flag {
        position: absolute;
        top: 12px;
        right: 16px;
        width: 36px;
        height: 24px;
        background: linear-gradient(180deg, #b3202e 0%, #b3202e 38%, #1c2540 38%, #1c2540 62%, #b3202e 62%);
        border: 2px solid #26261e;
      }

      .station-desk {
        position: absolute;
        bottom: 28px;
        left: 16px;
        width: 80px;
        height: 8px;
        background: #6d5637;
        border: 2px solid #4a3826;
        box-shadow: 0 8px 0 #5a4632;
      }

      .station-nco {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 100%;
        padding-bottom: 4px;
      }

      .station-nco-sprite {
        image-rendering: pixelated;
        height: auto;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.35));
      }

      .nco-dialogue {
        background: #282840;
        border: 3px solid var(--panel-border);
        padding: 12px 14px;
        min-height: 100px;
      }

      .nco-nameplate {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        margin-bottom: 8px;
      }

      .nco-text {
        margin: 0 0 12px;
        line-height: 1.5;
        color: #e8e8f0;
        font-size: 0.9rem;
        min-height: 2.8em;
      }

      .nco-choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }

      .nco-choice {
        text-align: left;
        width: 100%;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .nco-actions {
        display: flex;
        justify-content: flex-end;
      }

      .nco-continue {
        font-size: 0.55rem;
        padding: 10px 16px;
      }

      .recruiter-results {
        background: #282840;
        border: 2px solid var(--panel-border);
        padding: 14px;
      }

      .recruiter-result-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }

      .recruiter-final-stats {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 2px solid var(--panel-border);
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        text-align: center;
      }

      .stat-delta { font-family: var(--pixel-font); font-size: 0.55rem; }
      .stat-delta--up { color: #6dff8a; }
      .stat-delta--down { color: #ff6b6b; }

      /* --- Pull-up bar station scene --- */
      .recruiter-panel--pullup { width: min(720px, 96vw); }
      .recruiter-panel--pullup .recruiter-body { min-height: 300px; }

      .pullup-scene { width: 100%; }

      .pullup-yard {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 48px;
        background: linear-gradient(180deg, #8fa9c8 0%, #9fb26a 55%, #7a8f4a 100%);
        border: 3px solid var(--panel-border);
        padding: 20px 24px 0;
        height: 230px;
        image-rendering: pixelated;
      }

      .pullup-station {
        position: relative;
        width: 96px;
        height: 100%;
      }

      /* Horizontal pull-up bar */
      .pullup-bar {
        position: absolute;
        top: 24px;
        left: -6px;
        right: -6px;
        height: 6px;
        background: #d0d0d8;
        border: 2px solid #2a2a32;
        z-index: 3;
      }

      /* 4x4 timber posts */
      .pullup-post {
        position: absolute;
        top: 24px;
        bottom: 0;
        width: 12px;
        background: linear-gradient(90deg, #8a6f47 0%, #a8894f 45%, #6d5637 100%);
        border: 2px solid #4a3826;
        z-index: 2;
      }

      .pullup-post--left { left: 0; }
      .pullup-post--right { right: 0; }

      .pullup-recruit-slot {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .pullup-recruit-slot canvas {
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.3));
      }

      .pullup-timing-flash {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      .pullup-timing-flash--show { opacity: 1; }
      .pullup-timing-flash--perfect { color: #6dff8a; text-shadow: 2px 2px 0 #000; }
      .pullup-timing-flash--miss { color: #ff6b6b; text-shadow: 2px 2px 0 #000; }

      .pullup-hud {
        padding: 12px 4px 0;
      }

      .pullup-hud-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .pullup-reps {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
      }

      .pullup-timer {
        font-family: var(--pixel-font);
        font-size: 0.9rem;
        color: #ffd94a;
      }

      .pullup-energy {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .pullup-energy-label {
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #9898b0;
        white-space: nowrap;
      }

      .pullup-energy-track {
        flex: 1;
        height: 10px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }

      .pullup-energy-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff6b6b 0%, #ffd94a 50%, #6dff8a 100%);
        transition: width 0.15s linear;
      }

      .pullup-phase-hint {
        text-align: center;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.5;
        color: #cfcfe0;
      }

      .pullup-phase-hint b { color: #ffd94a; }

      /* --- Campaign schedule & proximity --- */
      .schedule-panel { width: min(520px, 94vw); }
      .schedule-body { margin-bottom: 16px; }
      .schedule-assignment {
        font-family: var(--pixel-font);
        font-size: 0.75rem;
        color: #ffd94a;
        margin: 0 0 12px;
      }
      .schedule-location {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 16px 0;
        padding: 12px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }
      .schedule-label {
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #686880;
        text-transform: uppercase;
      }
      .schedule-value {
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        color: #e8e8f0;
      }
      .schedule-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .activity-prompt {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 12px;
        background: rgba(20, 20, 40, 0.95);
        border: 3px solid var(--accent);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        padding: 12px 16px;
        z-index: 9998;
      }
      .activity-prompt-text {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #e8e8f0;
      }
      .activity-prompt-btn { padding: 8px 14px; font-size: 0.5rem; }

      /* --- In-game menu: toolbar, Character / Map / Journal --- */
      .game-toolbar {
        position: fixed;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
        z-index: 9999;
      }
      .game-toolbar-btn { display: inline-flex; align-items: center; gap: 6px; }
      .game-toolbar-btn--active { background: #4a6cff; color: #fff; }
      .game-toolbar-key {
        display: inline-block;
        padding: 2px 4px;
        border: 2px solid currentColor;
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        line-height: 1;
        opacity: 0.75;
      }
      @media (max-width: 640px) {
        .game-toolbar-btn { font-size: 0; gap: 0; }
        .game-toolbar-btn .game-toolbar-key { font-size: 0.5rem; border: 0; opacity: 1; }
      }

      .game-menu-panel {
        width: min(860px, 96vw);
        height: min(640px, 92vh);
        max-height: none;
        display: flex;
        flex-direction: column;
        padding: 0;
        overflow: hidden;
      }
      .game-menu-tabs {
        display: flex;
        background: #141426;
        border-bottom: 4px solid var(--panel-border);
      }
      .game-menu-tab, .game-menu-close {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 12px 16px;
        background: transparent;
        border: 0;
        border-right: 2px solid var(--panel-border);
        color: #9898b0;
        cursor: pointer;
        font-family: var(--pixel-font);
        font-size: 0.55rem;
      }
      .game-menu-tab:hover, .game-menu-close:hover { color: #e8e8f0; background: #24243c; }
      .game-menu-tab--active { color: #ffd94a; background: var(--panel-bg); }
      .game-menu-close { margin-left: auto; border-right: 0; border-left: 2px solid var(--panel-border); }
      .game-menu-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
      @media (max-width: 640px) {
        .game-menu-tab { padding: 10px; font-size: 0.45rem; }
        .game-menu-tab .game-toolbar-key { display: none; }
        .game-menu-body { padding: 14px; }
      }

      .sheet-heading {
        margin: 18px 0 10px;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        color: #ffd94a;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .sheet-heading:first-child { margin-top: 0; }

      /* Character sheet */
      .sheet { display: flex; gap: 24px; }
      .sheet-portrait-col { flex: 0 0 180px; text-align: center; }
      .sheet-portrait {
        display: flex;
        justify-content: center;
        background: radial-gradient(circle at 50% 70%, #2e3b28 0%, #1a1a2e 70%);
        border: 3px solid var(--panel-border);
        padding: 8px 0;
      }
      .sheet-name { margin: 12px 0 6px; font-family: var(--pixel-font); font-size: 0.7rem; color: #ffd94a; line-height: 1.4; word-break: break-word; }
      .sheet-rank { margin: 0 0 10px; font-family: var(--pixel-font); font-size: 0.5rem; color: #6dff8a; }
      .sheet-campaign { margin: 0; font-family: var(--pixel-font); font-size: 0.4rem; line-height: 1.7; color: #9898b0; }
      .sheet-main { flex: 1; min-width: 0; }
      .sheet-bg-name { margin: 0 0 6px; font-family: var(--pixel-font); font-size: 0.55rem; color: #e8e8f0; }
      .sheet-stats { display: flex; flex-direction: column; gap: 8px; }
      .sheet-stat {
        display: grid;
        grid-template-columns: 42px 150px 1fr 30px;
        grid-template-rows: auto auto;
        align-items: center;
        column-gap: 10px;
        cursor: help;
      }
      .sheet-stat-label { font-family: var(--pixel-font); font-size: 0.55rem; color: #ffd94a; }
      .sheet-stat-name { font-family: var(--pixel-font); font-size: 0.45rem; color: #cfcfe0; }
      .sheet-stat-value { font-family: var(--pixel-font); font-size: 0.65rem; text-align: right; }
      .sheet-stat-hint { grid-column: 2 / 5; font-size: 0.7rem; color: #686880; margin-top: 2px; }
      .sheet-meter {
        height: 10px;
        background: #12121f;
        border: 2px solid var(--panel-border);
      }
      .sheet-meter-fill {
        height: 100%;
        background: repeating-linear-gradient(90deg, #6a8cff 0 6px, #5a7cef 6px 8px);
      }
      .sheet-meter--water .sheet-meter-fill { background: repeating-linear-gradient(90deg, #6db8e8 0 6px, #5aa8d8 6px 8px); }
      .sheet-derived { margin: 10px 0 0; font-family: var(--pixel-font); font-size: 0.4rem; color: #9898b0; }
      .sheet-meter-row {
        display: grid;
        grid-template-columns: 110px 1fr 44px;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }
      .sheet-meter-row > span:last-child { text-align: right; font-family: var(--pixel-font); font-size: 0.5rem; }
      .sheet-record .recruiter-result-row > span:last-child { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
      .sheet-record .grade-badge { font-size: 0.4rem; padding: 3px 5px; }
      @media (max-width: 640px) {
        .sheet { flex-direction: column; }
        .sheet-portrait-col { flex: none; }
        .sheet-stat { grid-template-columns: 36px 1fr 1fr 26px; }
        .sheet-stat-hint { display: none; }
      }

      /* Field map */
      .fieldmap { display: flex; flex-direction: column; height: 100%; }
      .fieldmap-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
      .fieldmap-title { font-family: var(--pixel-font); font-size: 0.7rem; color: #ffd94a; }
      .fieldmap-meta { font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; }
      .fieldmap-layout { display: flex; gap: 16px; flex: 1; min-height: 0; }
      .fieldmap-canvas-wrap {
        flex: 1;
        min-width: 0;
        position: relative;
        background: #0c0c18;
        border: 3px solid var(--panel-border);
      }
      .fieldmap-canvas { position: absolute; inset: 0; width: 100%; display: block; }
      .fieldmap-side { flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
      .fieldmap-orders {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 10px;
        border: 2px solid #ffd94a;
        background: #2a2618;
        margin-bottom: 6px;
      }
      .fieldmap-orders .schedule-value { color: #ffd94a; font-size: 0.55rem; line-height: 1.5; }
      .fieldmap-orders-title { font-size: 0.75rem; color: #cfcfe0; }
      .fieldmap-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; flex: 1; min-height: 0; overflow-y: auto; }
      .fieldmap-legend-item {
        width: 100%;
        text-align: left;
        padding: 6px 8px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: #cfcfe0;
        font-size: 0.8rem;
        cursor: pointer;
      }
      .fieldmap-legend-item:hover { background: #34345a; color: #fff; }
      .fieldmap-legend-item--objective { color: #ffd94a; border-color: #ffd94a; }
      .fieldmap-empty { font-size: 0.8rem; color: #686880; }
      .fieldmap-hint { margin: 4px 0 0; font-size: 0.75rem; color: #686880; line-height: 1.4; }
      @media (max-width: 720px) {
        .fieldmap-layout { flex-direction: column; }
        .fieldmap-canvas-wrap { flex: 1 1 260px; }
        .fieldmap-side { flex: none; }
        .fieldmap-legend { max-height: 120px; }
      }

      /* Journal */
      .journal-sections { display: flex; gap: 8px; margin-bottom: 16px; }
      .journal-section-btn--active { background: #4a6cff; color: #fff; }
      .journal-card {
        padding: 12px 14px;
        background: #191930;
        border: 2px solid var(--panel-border);
      }
      .journal-card .schedule-location { margin-bottom: 0; }
      .journal-card .recruiter-copy:last-child { margin-bottom: 0; }
      .journal-week {
        margin-bottom: 8px;
        padding: 10px 12px;
        background: #191930;
        border: 2px solid var(--panel-border);
      }
      .journal-week--current { border-color: #4a6cff; }
      .journal-week--locked { opacity: 0.45; }
      .journal-week-title { font-family: var(--pixel-font); font-size: 0.5rem; line-height: 1.6; color: #e8e8f0; cursor: pointer; }
      .journal-week--locked .journal-week-title { cursor: default; }
      .journal-week-theme { margin: 8px 0; font-size: 0.8rem; color: #9898b0; }
      .journal-days { list-style: none; margin: 0; padding: 0; }
      .journal-day {
        display: grid;
        grid-template-columns: 1fr auto auto;
        gap: 10px;
        align-items: center;
        padding: 6px 0;
        border-top: 1px solid #2a2a44;
        font-size: 0.85rem;
      }
      .journal-day-loc { color: #686880; font-size: 0.75rem; }
      .journal-day-status { min-width: 64px; text-align: right; }
      .journal-day-status .grade-badge { font-size: 0.4rem; padding: 3px 5px; }
      .journal-day--done .journal-day-title { color: #9898b0; }
      .journal-day--today .journal-day-title { color: #ffd94a; }
      .journal-status { font-family: var(--pixel-font); font-size: 0.4rem; }
      .journal-status--today { color: #ffd94a; }
      .journal-sq-list { margin: 8px 0 0; padding-left: 18px; font-size: 0.85rem; color: #cfcfe0; line-height: 1.6; }
      .journal-count { font-size: 0.45rem; color: #9898b0; }
      .journal-note {
        margin-bottom: 10px;
        padding: 10px 14px;
        background: #191930;
        border-left: 4px solid #6a8cff;
      }
      .journal-note--lesson { border-left-color: #6dff8a; }
      .journal-note-topic { margin: 0 0 6px; font-family: var(--pixel-font); font-size: 0.5rem; line-height: 1.5; color: #ffd94a; }
      .journal-note-text { margin: 0 0 6px; font-size: 0.85rem; line-height: 1.5; color: #cfcfe0; }
      .journal-note-quote { margin: 0 0 6px; font-size: 0.85rem; font-style: italic; color: #9898b0; }
      .journal-note-source { margin: 0; font-family: var(--pixel-font); font-size: 0.4rem; color: #686880; }

      .grade-badge {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        padding: 4px 8px;
        border: 2px solid var(--panel-border);
      }
      .grade-badge--honor { color: #ffd94a; background: #3a3020; }
      .grade-badge--passing { color: #6dff8a; background: #1a3020; }
      .grade-badge--unsat { color: #ff6b6b; background: #301a1a; }

      .campaign-panel { width: min(620px, 94vw); }

      /* --- Drill cadence mini-game --- */
      .drill-scene { width: 100%; text-align: center; }
      .drill-deck {
        height: 80px;
        background: linear-gradient(180deg, #7a8f4a 0%, #5f7539 100%);
        border: 3px solid var(--panel-border);
        margin-bottom: 16px;
      }
      .drill-command {
        font-family: var(--pixel-font);
        margin: 16px 0;
        min-height: 4.2rem;
      }
      .drill-prep {
        font-size: 1.1rem;
        color: #e8e8f0;
        margin-bottom: 10px;
      }
      .drill-exec {
        font-size: 1.8rem;
        color: #686880;
      }
      .drill-command--prep .drill-prep { color: #ffd94a; }
      .drill-command--exec .drill-prep { color: #9898b0; }
      .drill-command--exec .drill-exec {
        color: #ffd94a;
        animation: mg-exec-pop 0.25s ease;
      }
      .drill-rule {
        margin-top: 12px;
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        color: #9898b0;
        line-height: 1.6;
      }
      .drill-beat {
        width: 24px;
        height: 24px;
        margin: 0 auto 16px;
        background: #3d3d5c;
        border: 2px solid var(--panel-border);
        border-radius: 50%;
      }
      .drill-beat--pulse { background: #ffd94a; transform: scale(1.2); transition: transform 0.1s; }
      .drill-hud {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        margin-bottom: 12px;
      }
      .drill-flash { font-size: 1rem; min-width: 160px; min-height: 1.2em; }
      .drill-flash--hit { color: #6dff8a; }
      .drill-flash--miss { color: #ff6b6b; }
      .drill-flash--wait { color: #ffd94a; }
      .drill-flash--show { animation: drill-flash 0.7s ease; }
      @keyframes drill-flash {
        0% { opacity: 0; transform: scale(0.8); }
        20% { opacity: 1; transform: scale(1.1); }
        80% { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1); }
      }
      .drill-keys {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      /* --- Core values mini-game --- */
      .corevalues-scene { width: 100%; }
      .corevalues-trait {
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        color: #ffd94a;
        text-align: center;
        margin-bottom: 16px;
        padding: 12px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }
      .corevalues-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .corevalues-choices .cv-choice {
        text-align: left;
        font-size: 0.5rem;
        line-height: 1.5;
        white-space: normal;
      }
      .corevalues-progress {
        margin-top: 12px;
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #686880;
        text-align: center;
      }

      /* --- Shared mini-game kit (weeks 2–13) --- */
      .mg-scene { width: 100%; text-align: center; }
      .mg-title {
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        color: #ffd94a;
        margin-bottom: 12px;
      }
      .mg-main {
        min-height: 120px;
        margin-bottom: 12px;
        position: relative;
      }
      .mg-hud {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        margin-bottom: 8px;
      }
      .mg-flash { font-size: 1rem; min-width: 160px; min-height: 1.2em; }
      .mg-flash--hit { color: #6dff8a; }
      .mg-flash--miss { color: #ff6b6b; }
      .mg-flash--wait { color: #ffd94a; }
      .mg-flash--show { animation: drill-flash 0.7s ease; }
      .mg-meter-track {
        height: 10px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
        margin-bottom: 8px;
      }
      .mg-meter-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff6b6b 0%, #ffd94a 50%, #6dff8a 100%);
        transition: width 0.1s linear;
      }
      .mg-hint {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #9898b0;
        line-height: 1.7;
      }
      .mg-hint kbd {
        background: #282840;
        border: 2px solid var(--panel-border);
        padding: 2px 6px;
        color: #e8e8f0;
      }
      .mg-hint-rule {
        margin-top: 8px;
        font-size: 0.5rem;
        color: #ffd94a;
      }
      .mg-prompt {
        font-family: var(--pixel-font);
        font-size: 1rem;
        line-height: 1.5;
        color: #e8e8f0;
        margin-bottom: 14px;
      }
      .mg-key-hint, .mg-wind {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        line-height: 2;
        color: #9898b0;
      }
      .mg-key-hint kbd, .mg-wind kbd {
        display: inline-block;
        min-width: 1.8em;
        background: #282840;
        border: 3px solid var(--panel-border);
        padding: 6px 10px;
        font-size: 1rem;
        color: #ffd94a;
      }
      .mg-choices, .mg-seq-btns {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mg-choice, .mg-seq-btn {
        text-align: left;
        font-size: 0.7rem;
        line-height: 1.5;
        padding: 14px 16px;
        min-height: 52px;
        white-space: normal;
      }
      .mg-seq-status {
        font-family: var(--pixel-font);
        font-size: 0.75rem;
        color: #ffd94a;
        margin-bottom: 12px;
      }

      /* Drill-style command: preparatory (not yet) vs execution (lit key) */
      .mg-command {
        font-family: var(--pixel-font);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .mg-prep-word {
        font-size: 1.1rem;
        line-height: 1.4;
        color: #ffd94a;
      }
      .mg-exec-word {
        font-size: 1.6rem;
        line-height: 1.3;
        min-height: 1.3em;
        color: #686880;
      }
      .mg-command--exec .mg-prep-word { color: #9898b0; font-size: 0.85rem; }
      .mg-command--exec .mg-exec-word { color: #ffd94a; animation: mg-exec-pop 0.25s ease; }
      .mg-command--hostile .mg-exec-word { color: #ff6b6b; }
      .mg-command--hold .mg-exec-word { color: #6de88a; }
      .mg-phase-note { font-size: 0.7rem; color: #9898b0; }
      .mg-command--exec .mg-phase-note { color: #e8e8f0; }
      .mg-key-row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
      @keyframes mg-exec-pop {
        0% { transform: scale(0.85); }
        60% { transform: scale(1.12); }
        100% { transform: scale(1); }
      }
      .mg-key {
        font-family: var(--pixel-font);
        display: inline-flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-width: 112px;
        min-height: 104px;
        padding: 10px 14px;

      /* --- Touch pad (touch-primary devices only, mounted by touchPad.js) --- */
      :root {
        --pad-btn: 64px;
        --pad-gap: 6px;
        --pad-edge: 10px;
        --pad-cluster: calc(var(--pad-btn) * 3 + var(--pad-gap) * 2);
        --pad-safe-l: env(safe-area-inset-left, 0px);
        --pad-safe-r: env(safe-area-inset-right, 0px);
        --pad-safe-b: env(safe-area-inset-bottom, 0px);
      }
      @media (orientation: portrait) {
        :root { --pad-btn: 56px; }
      }
      @media (min-width: 700px) and (min-height: 700px) {
        :root { --pad-btn: 80px; }
      }
      .mg-pad {
        position: fixed;
        inset: 0;
        z-index: 10001;
        pointer-events: none;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      .mg-pad [hidden] { display: none !important; }
      .mg-pad-cluster {
        position: absolute;
        bottom: calc(var(--pad-edge) + var(--pad-safe-b));
        display: grid;
        grid-template-columns: repeat(3, var(--pad-btn));
        grid-template-rows: repeat(3, var(--pad-btn));
        gap: var(--pad-gap);
      }
      .mg-pad-cluster--left { left: calc(var(--pad-edge) + var(--pad-safe-l)); }
      .mg-pad-cluster--right { right: calc(var(--pad-edge) + var(--pad-safe-r)); }
      .mg-pad-center {
        position: absolute;
        left: 50%;
        bottom: calc(var(--pad-edge) + var(--pad-safe-b));
        transform: translateX(-50%);
        display: flex;
        gap: var(--pad-gap);
      }
      .mg-pad .mg-pad-btn {
        pointer-events: auto;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        min-width: 0;
        min-height: 0;
        width: var(--pad-btn);
        height: var(--pad-btn);
        padding: 0;
        gap: 0;
        border-width: 3px;
        background: rgba(40, 40, 64, 0.88);
      }
      .mg-pad .mg-pad-btn--up { grid-area: 1 / 2; }
      .mg-pad .mg-pad-btn--left { grid-area: 2 / 1; }
      .mg-pad .mg-pad-btn--right { grid-area: 2 / 3; }
      .mg-pad .mg-pad-btn--down { grid-area: 3 / 2; }
      .mg-pad .mg-pad-btn--space,
      .mg-pad .mg-pad-btn--enter { width: calc(var(--pad-btn) * 1.6); }
      .mg-pad-cap { font-size: calc(var(--pad-btn) * 0.34); line-height: 1; pointer-events: none; }
      .mg-pad-btn--space .mg-pad-cap,
      .mg-pad-btn--enter .mg-pad-cap { font-size: calc(var(--pad-btn) * 0.18); }
      .mg-pad--arrows .mg-pad-cluster--left .mg-pad-cap { font-size: calc(var(--pad-btn) * 0.42); }
      .mg-pad .mg-pad-btn--off { opacity: 0.12; pointer-events: none; }
      .mg-pad .mg-pad-btn--pressed:not(.mg-key--go) { background: #3d3d5c; border-color: #9898b0; }
      .mg-pad .mg-key--go { background: #ffd94a; }
      .mg-pad .mg-key--hit { background: #1a3020; }
      .mg-pad .mg-key--miss { background: #301a1a; }

      /* Keep the mini-game panel clear of the pad */
      @media (orientation: landscape) {
        html.mg-pad-open .mg-pad-frame {
          box-sizing: border-box;
          max-width: calc(100vw - 2 * (var(--pad-cluster) + var(--pad-edge) * 3 + max(var(--pad-safe-l), var(--pad-safe-r))));
          padding: 12px;
        }
        html.mg-pad-open--center .mg-pad-frame {
          --pad-reserve: calc(var(--pad-btn) + var(--pad-edge) * 2 + var(--pad-safe-b));
          max-height: calc(100vh - var(--pad-reserve) - 8px);
          max-height: calc(100dvh - var(--pad-reserve) - 8px);
          margin-bottom: var(--pad-reserve);
        }
      }
      @media (orientation: portrait) {
        .mg-pad-center { bottom: calc(var(--pad-edge) * 2 + var(--pad-cluster) + var(--pad-safe-b)); }
        html.mg-pad-open .mg-pad-frame {
          box-sizing: border-box;
          --pad-reserve: calc(var(--pad-cluster) + var(--pad-edge) * 2 + var(--pad-safe-b));
          max-height: calc(100vh - var(--pad-reserve) - 8px);
          max-height: calc(100dvh - var(--pad-reserve) - 8px);
          margin-bottom: var(--pad-reserve);
          padding: 12px;
        }
        html.mg-pad-open--center .mg-pad-frame {
          --pad-reserve: calc(var(--pad-cluster) + var(--pad-btn) + var(--pad-edge) * 3 + var(--pad-safe-b));
        }
      }
      /* Short landscape phones: compact the panel so the game fits beside the pad */
      @media (orientation: landscape) and (max-height: 500px) {
        html.mg-pad-open .mg-pad-frame .menu-title { font-size: 0.7rem; margin-bottom: 4px; }
        html.mg-pad-open .mg-pad-frame .menu-subtitle { font-size: 0.5rem; margin-bottom: 0; }

      /* Inspection board (footlocker / uniform): every tile looks alike until inspected */

      .mg-insp-tile {

      /* Short landscape phones: two rows of tiles, compact panel chrome */

        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        margin-bottom: 16px;
        text-align: center;
      }
      .locker-perk-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
      .locker-perk {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);

      .locker-perk--owned { opacity: 0.7; }

      .locker-perk-name { display: block; font-family: var(--pixel-font); font-size: 0.55rem; color: #e8e8f0; }

      .locker-owned-badge { font-family: var(--pixel-font); font-size: 0.45rem; color: #6dff8a; }
      .locker-buy-btn { font-size: 0.45rem; white-space: nowrap; }

      /* --- Hydration HUD --- */
      .recruit-hydration {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .recruit-hydration-label {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #6db8e8;
        min-width: 32px;
      }

        flex: 1;
        height: 8px;
        background: #1e1e32;
        border: 1px solid var(--panel-border);
      }
      .recruit-hydration-fill {
        height: 100%;

        transition: width 0.2s linear;
      }
      .recruit-hydration-value {

        min-width: 28px;
        text-align: right;

      .recruit-mode-badge {
        font-size: 0.4rem;
        padding: 1px 4px;
        border: 1px solid var(--panel-border);

      }
      .recruit-mode-badge--ironman { color: #ff6b6b; }
      .recruit-mode-badge--sandbox { color: #6db8e8; }
      .recruit-token-badge {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #ffd94a;
        margin-left: 4px;

      /* --- Run end / ironman --- */
      .runend-panel { width: min(460px, 94vw); }

      .sandbox-prompt { flex-direction: column; align-items: stretch; }

      .mg-countdown {
        font-family: var(--pixel-font);
        font-size: 1.2rem;
        color: #ff6b6b;
        margin: 8px 0;
      }

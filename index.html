<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-bit Bootcamp 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      :root {
        --pixel-font: 'Press Start 2P', monospace;
        --panel-bg: #1e1e32;
        --panel-border: #0a0a14;
        --accent: #6a8cff;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f0f1a;
        color: #e8e8f0;
      }
      canvas { display: block; }

      /* Game canvas renders at low internal resolution and upscales with hard pixels */
      .game-canvas {
        width: 100vw !important;
        height: 100vh !important;
        image-rendering: pixelated;
      }

      .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 8, 20, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .menu-panel {
        background: var(--panel-bg);
        border: 4px solid var(--panel-border);
        box-shadow: 0 0 0 4px #3d3d5c, 8px 8px 0 rgba(0, 0, 0, 0.5);
        padding: 24px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .menu-title {
        margin: 0 0 12px;
        font-family: var(--pixel-font);
        font-size: 1.1rem;
        line-height: 1.5;
        letter-spacing: 0.02em;
        text-align: center;
        color: #ffd94a;
        text-shadow: 3px 3px 0 #000;
      }

      .menu-subtitle {
        margin: 0 0 20px;
        text-align: center;
        color: #9898b0;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.6;
      }

      .menu-hint {
        margin: 16px 0 0;
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        line-height: 1.6;
        color: #686880;
        text-align: center;
      }

      .slot-panel { width: min(420px, 92vw); }

      .slot-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .slot-row {
        display: flex;
        align-items: stretch;
        gap: 10px;
      }

      .slot-row--focused .slot-card {
        border-color: var(--accent);
      }

      .slot-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        flex: 1;
        padding: 14px 16px;
        background: #282840;
        border: 3px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
        color: inherit;
        cursor: pointer;
        text-align: left;
        font: inherit;
      }

      .slot-card:hover,
      .slot-card:focus {
        border-color: var(--accent);
        outline: none;
      }

      .slot-reset-btn {
        align-self: center;
        flex-shrink: 0;
        padding: 10px 12px;
        font-size: 0.5rem;
      }

      .slot-card--empty .slot-name { color: #9898b0; }

      .slot-label { font-family: var(--pixel-font); font-size: 0.5rem; color: #686880; text-transform: uppercase; }
      .slot-name { font-family: var(--pixel-font); font-size: 0.75rem; line-height: 1.4; }
      .slot-meta { font-size: 0.85rem; color: #9898b0; }

      .builder-panel {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 24px;
        width: min(820px, 96vw);
        max-height: 92vh;
      }

      .builder-preview {
        background: #12122a;
        border: 3px solid var(--panel-border);
        min-height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .builder-preview canvas { image-rendering: pixelated; }

      .builder-form { min-width: 0; }

      .builder-form h2 {
        margin-top: 0;
        text-align: left;
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        color: #ffd94a;
        text-shadow: 2px 2px 0 #000;
      }

      .field {
        display: block;
        margin-bottom: 14px;
        border: none;
        padding: 0;
      }

      .field > span:first-child,
      .field legend {
        display: block;
        font-size: 0.8rem;
        color: #9898b0;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .field legend { margin-bottom: 8px; }

      .field label { margin-right: 12px; cursor: pointer; }

      .name-row { display: flex; gap: 8px; }
      .name-row input { flex: 1; }

      input[type="text"],
      input[type="range"] { width: 100%; }

      input[type="text"] {
        padding: 8px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: inherit;
        font: inherit;
      }

      input[type="text"]:focus { border-color: var(--accent); outline: none; }

      .field-error {
        display: block;
        color: #ff6b6b;
        font-size: 0.8rem;
        min-height: 1.2em;
        margin-top: 4px;
      }

      .swatch-row, .outfit-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .swatch {
        width: 28px;
        height: 28px;
        border: 3px solid var(--panel-border);
        cursor: pointer;
        padding: 0;
      }

      .swatch--selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

      .background-list { display: flex; flex-direction: column; gap: 6px; }

      .background-option {
        display: block;
        padding: 8px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        cursor: pointer;
      }

      .background-option--selected { border-color: var(--accent); }

      .background-option input { margin-right: 8px; }

      .background-name { font-weight: 600; display: block; }
      .background-desc { font-size: 0.85rem; color: #9898b0; display: block; margin-top: 2px; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .stat-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .stat-meta {
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        color: #9898b0;
      }

      .stat-meta--points { color: #ffd94a; }

      .stat-hint {
        margin: 0 0 10px;
        font-size: 0.75rem;
        color: #686880;
        line-height: 1.4;
      }

      .btn-compact {
        padding: 8px 12px;
        font-size: 0.5rem;
      }

      .stat-row {
        background: #282840;
        padding: 6px 4px;
        border: 2px solid var(--panel-border);
        text-align: center;
        cursor: help;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .stat--str { border-color: var(--accent); }

      .stat-label { display: block; font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; }

      .stat-controls {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .stat-btn {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 2px solid var(--panel-border);
        background: #1e1e32;
        color: #e8e8f0;
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        line-height: 1;
        cursor: pointer;
      }

      .stat-btn:hover:not(:disabled) { border-color: var(--accent); background: #323258; }
      .stat-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      .stat-value {
        display: block;
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        min-width: 1.4em;
        text-align: center;
      }

      .stat-bg-mod {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #6a8cff;
      }

      .hint { font-size: 0.7rem; color: #686880; text-transform: none; font-weight: normal; }

      .outfit-btn {
        padding: 6px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: inherit;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .outfit-btn--selected { border-color: var(--accent); background: #323258; }

      .builder-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .btn {
        padding: 12px 16px;
        border: 3px solid var(--panel-border);
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
        cursor: pointer;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.4;
      }

      .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }

      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .btn-primary { background: #4a6cff; color: #fff; flex: 1; }
      .btn-primary:hover:not(:disabled) { background: #5a7cff; }

      .btn-secondary { background: #3d3d5c; color: #e8e8f0; }
      .btn-secondary:hover { background: #4d4d6c; }

      .btn-danger { background: #c0392b; color: #fff; }
      .btn-danger:hover { background: #e74c3c; }

      .confirm-overlay { z-index: 10001; }

      .confirm-box {
        background: var(--panel-bg);
        border: 4px solid var(--panel-border);
        box-shadow: 0 0 0 4px #3d3d5c, 8px 8px 0 rgba(0, 0, 0, 0.5);
        padding: 24px;
        max-width: 360px;
        text-align: center;
      }

      .confirm-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

      .recruit-hud {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 20, 40, 0.92);
        border: 3px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
        padding: 10px 14px;
        z-index: 9999;
        min-width: 190px;
      }

      .recruit-hud-name {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        line-height: 1.4;
        color: #ffd94a;
        margin-bottom: 4px;
      }
      .recruit-hud-meta { font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; margin-bottom: 8px; }

      .recruit-hud-stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .recruit-stat {
        text-align: center;
        cursor: help;
        padding: 3px 4px;
        background: rgba(40, 40, 64, 0.9);
        border: 2px solid var(--panel-border);
      }

      .recruit-stat-label { display: block; font-family: var(--pixel-font); font-size: 0.4rem; color: #9898b0; }
      .recruit-stat-value { display: block; font-family: var(--pixel-font); font-size: 0.6rem; margin-top: 3px; }

      .location-hud {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #cfcfe0;
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        line-height: 1.5;
        background: rgba(20, 20, 40, 0.85);
        border: 2px solid var(--panel-border);
        padding: 6px 10px;
        z-index: 9999;
      }

      .recruiter-panel { width: min(520px, 94vw); }
      .recruiter-panel--asvab { width: min(720px, 96vw); }
      .recruiter-panel--station { width: min(720px, 96vw); }

      .recruiter-body { margin: 16px 0; min-height: 120px; }
      .recruiter-panel--asvab .recruiter-body { min-height: 280px; }
      .recruiter-panel--station .recruiter-body { min-height: 320px; }

      .recruiter-actions { display: flex; gap: 10px; justify-content: center; }

      .recruiter-copy { margin: 0 0 12px; line-height: 1.5; color: #cfcfe0; }
      .recruiter-copy--small { font-size: 0.8rem; color: #9898b0; }

      .recruiter-checklist {
        margin: 0 0 16px;
        padding-left: 20px;
        color: #cfcfe0;
        line-height: 1.6;
      }

      .asvab-question {
        font-size: 0.9rem;
        line-height: 1.45;
        margin: 0 0 12px;
        color: #2a2a32;
        font-family: 'Courier New', Courier, monospace;
      }

      .asvab-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .asvab-choice {
        text-align: left;
        width: 100%;
      }

      /* --- ASVAB folding-table scene --- */
      .asvab-scene { width: 100%; }

      .asvab-room {
        display: grid;
        grid-template-columns: 1fr 130px;
        gap: 8px;
        align-items: end;
        background: linear-gradient(180deg, #9aa0a8 0%, #7a8088 100%);
        border: 3px solid var(--panel-border);
        padding: 12px 12px 0;
        min-height: 260px;
        image-rendering: pixelated;
      }

      .asvab-table-unit {
        position: relative;
        padding-bottom: 8px;
      }

      .folding-table {
        position: relative;
        margin-bottom: -4px;
      }

      .folding-table-top {
        height: 10px;
        background: #6e757d;
        border: 2px solid #4a5058;
        box-shadow: inset 0 2px 0 #8a929a;
      }

      .folding-table-legs {
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
      }

      .folding-leg {
        display: block;
        width: 4px;
        height: 52px;
        background: #5a6068;
        border: 1px solid #3a4048;
      }

      .asvab-paper {
        position: relative;
        background: #f2ecd8;
        border: 2px solid #c8bfa8;
        box-shadow: 2px 2px 0 #8a8070, inset 0 0 0 1px #fff8e8;
        padding: 10px 12px 8px;
        margin-top: 0;
        min-height: 180px;
        transform: rotate(-0.4deg);
      }

      .asvab-paper-header {
        display: flex;
        justify-content: space-between;
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #5a5040;
        border-bottom: 2px dashed #c0b898;
        padding-bottom: 6px;
        margin-bottom: 10px;
      }

      .asvab-paper-footer {
        margin: 10px 0 0;
        font-size: 0.65rem;
        color: #8a7060;
        font-style: italic;
      }

      .asvab-bubbles {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .asvab-bubble {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 5px 6px;
        border: none;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: #2a2a32;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
      }

      .asvab-bubble:hover { background: rgba(200, 80, 60, 0.08); }

      .asvab-bubble-mark {
        width: 14px;
        height: 14px;
        border: 2px solid #3a3530;
        border-radius: 50%;
        flex-shrink: 0;
        background: #f2ecd8;
      }

      .asvab-bubble--filled .asvab-bubble-mark {
        background: #c84838;
        box-shadow: inset 0 0 0 2px #a03028;
      }

      .asvab-bubble-letter {
        font-weight: 700;
        min-width: 1.2em;
      }

      .asvab-crayon {
        position: absolute;
        right: 12px;
        bottom: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        transform: rotate(12deg);
        pointer-events: none;
      }

      .asvab-crayon-body {
        display: block;
        width: 10px;
        height: 36px;
        background: linear-gradient(90deg, #a83828 0%, #d05040 40%, #a83828 100%);
        border: 1px solid #782018;
        clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
      }

      .asvab-crayon-label {
        font-family: var(--pixel-font);
        font-size: 0.35rem;
        color: #5a4040;
        letter-spacing: 0.05em;
      }

      .asvab-recruit-seat {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 4px;
      }

      .asvab-chair-back {
        width: 52px;
        height: 28px;
        background: #4a5058;
        border: 2px solid #2a3038;
        margin-bottom: -6px;
        z-index: 0;
      }

      .asvab-recruit-slot {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 160px;
      }

      .asvab-recruit-slot canvas {
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.35));
      }

      /* --- NCO recruiting station scene --- */
      .station-scene { width: 100%; }

      .station-room {
        position: relative;
        height: 200px;
        background: linear-gradient(180deg, #c8ccd4 0%, #a8acb4 55%, #8a6f47 55%, #6d5637 100%);
        border: 3px solid var(--panel-border);
        margin-bottom: 12px;
        overflow: hidden;
      }

      .station-flag {
        position: absolute;
        top: 12px;
        right: 16px;
        width: 36px;
        height: 24px;
        background: linear-gradient(180deg, #b3202e 0%, #b3202e 38%, #1c2540 38%, #1c2540 62%, #b3202e 62%);
        border: 2px solid #26261e;
      }

      .station-desk {
        position: absolute;
        bottom: 28px;
        left: 16px;
        width: 80px;
        height: 8px;
        background: #6d5637;
        border: 2px solid #4a3826;
        box-shadow: 0 8px 0 #5a4632;
      }

      .station-nco {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 100%;
        padding-bottom: 4px;
      }

      .station-nco-sprite {
        image-rendering: pixelated;
        height: auto;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.35));
      }

      .nco-dialogue {
        background: #282840;
        border: 3px solid var(--panel-border);
        padding: 12px 14px;
        min-height: 100px;
      }

      .nco-nameplate {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        margin-bottom: 8px;
      }

      .nco-text {
        margin: 0 0 12px;
        line-height: 1.5;
        color: #e8e8f0;
        font-size: 0.9rem;
        min-height: 2.8em;
      }

      .nco-choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }

      .nco-choice {
        text-align: left;
        width: 100%;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .nco-actions {
        display: flex;
        justify-content: flex-end;
      }

      .nco-continue {
        font-size: 0.55rem;
        padding: 10px 16px;
      }

      .recruiter-results {
        background: #282840;
        border: 2px solid var(--panel-border);
        padding: 14px;
      }

      .recruiter-result-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }

      .recruiter-final-stats {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 2px solid var(--panel-border);
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        text-align: center;
      }

      .stat-delta { font-family: var(--pixel-font); font-size: 0.55rem; }
      .stat-delta--up { color: #6dff8a; }
      .stat-delta--down { color: #ff6b6b; }

      /* --- Pull-up bar station scene --- */
      .recruiter-panel--pullup { width: min(720px, 96vw); }
      .recruiter-panel--pullup .recruiter-body { min-height: 300px; }

      .pullup-scene { width: 100%; }

      .pullup-yard {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 48px;
        background: linear-gradient(180deg, #8fa9c8 0%, #9fb26a 55%, #7a8f4a 100%);
        border: 3px solid var(--panel-border);
        padding: 20px 24px 0;
        height: 230px;
        image-rendering: pixelated;
      }

      .pullup-station {
        position: relative;
        width: 96px;
        height: 100%;
      }

      /* Horizontal pull-up bar */
      .pullup-bar {
        position: absolute;
        top: 24px;
        left: -6px;
        right: -6px;
        height: 6px;
        background: #d0d0d8;
        border: 2px solid #2a2a32;
        z-index: 3;
      }

      /* 4x4 timber posts */
      .pullup-post {
        position: absolute;
        top: 24px;
        bottom: 0;
        width: 12px;
        background: linear-gradient(90deg, #8a6f47 0%, #a8894f 45%, #6d5637 100%);
        border: 2px solid #4a3826;
        z-index: 2;
      }

      .pullup-post--left { left: 0; }
      .pullup-post--right { right: 0; }

      .pullup-recruit-slot {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .pullup-recruit-slot canvas {
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.3));
      }

      .pullup-timing-flash {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      .pullup-timing-flash--show { opacity: 1; }
      .pullup-timing-flash--perfect { color: #6dff8a; text-shadow: 2px 2px 0 #000; }
      .pullup-timing-flash--miss { color: #ff6b6b; text-shadow: 2px 2px 0 #000; }

      .pullup-hud {
        padding: 12px 4px 0;
      }

      .pullup-hud-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }

      .pullup-reps {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
      }

      .pullup-timer {
        font-family: var(--pixel-font);
        font-size: 0.9rem;
        color: #ffd94a;
      }

      .pullup-energy {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .pullup-energy-label {
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #9898b0;
        white-space: nowrap;
      }

      .pullup-energy-track {
        flex: 1;
        height: 10px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }

      .pullup-energy-bar {
        height: 100%;
        width: 100%;
        background: linear-gradient(90deg, #ff6b6b 0%, #ffd94a 50%, #6dff8a 100%);
        transition: width 0.15s linear;
      }

      .pullup-phase-hint {
        text-align: center;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.5;
        color: #cfcfe0;
      }

      .pullup-phase-hint b { color: #ffd94a; }

      /* --- Campaign schedule & proximity --- */
      .schedule-panel { width: min(520px, 94vw); }
      .schedule-body { margin-bottom: 16px; }
      .schedule-assignment {
        font-family: var(--pixel-font);
        font-size: 0.75rem;
        color: #ffd94a;
        margin: 0 0 12px;
      }
      .schedule-location {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin: 16px 0;
        padding: 12px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }
      .schedule-label {
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #686880;
        text-transform: uppercase;
      }
      .schedule-value {
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        color: #e8e8f0;
      }
      .schedule-actions {
        display: flex;
        justify-content: center;
        gap: 10px;
      }

      .activity-prompt {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        display: none;
        align-items: center;
        gap: 12px;
        background: rgba(20, 20, 40, 0.95);
        border: 3px solid var(--accent);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        padding: 12px 16px;
        z-index: 9998;
      }
      .activity-prompt-text {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #e8e8f0;
      }
      .activity-prompt-btn { padding: 8px 14px; font-size: 0.5rem; }

      .grade-badge {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        padding: 4px 8px;
        border: 2px solid var(--panel-border);
      }
      .grade-badge--honor { color: #ffd94a; background: #3a3020; }
      .grade-badge--passing { color: #6dff8a; background: #1a3020; }
      .grade-badge--unsat { color: #ff6b6b; background: #301a1a; }

      .campaign-panel { width: min(620px, 94vw); }

      /* --- Drill cadence mini-game --- */
      .drill-scene { width: 100%; text-align: center; }
      .drill-deck {
        height: 80px;
        background: linear-gradient(180deg, #7a8f4a 0%, #5f7539 100%);
        border: 3px solid var(--panel-border);
        margin-bottom: 16px;
      }
      .drill-command {
        font-family: var(--pixel-font);
        font-size: 1rem;
        color: #ffd94a;
        margin: 16px 0;
        min-height: 2em;
      }
      .drill-beat {
        width: 24px;
        height: 24px;
        margin: 0 auto 16px;
        background: #3d3d5c;
        border: 2px solid var(--panel-border);
        border-radius: 50%;
      }
      .drill-beat--pulse { background: #ffd94a; transform: scale(1.2); transition: transform 0.1s; }
      .drill-hud {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        margin-bottom: 12px;
      }
      .drill-flash { font-size: 0.6rem; min-width: 48px; }
      .drill-flash--hit { color: #6dff8a; }
      .drill-flash--miss { color: #ff6b6b; }
      .drill-flash--show { animation: drill-flash 0.4s ease; }
      @keyframes drill-flash {
        0% { opacity: 0; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.1); }
        100% { opacity: 0; transform: scale(1); }
      }
      .drill-keys {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #9898b0;
      }
      .drill-keys kbd {
        background: #282840;
        border: 2px solid var(--panel-border);
        padding: 2px 6px;
        margin-right: 4px;
      }

      /* --- Core values mini-game --- */
      .corevalues-scene { width: 100%; }
      .corevalues-trait {
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        color: #ffd94a;
        text-align: center;
        margin-bottom: 16px;
        padding: 12px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }
      .corevalues-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .corevalues-choices .cv-choice {
        text-align: left;
        font-size: 0.5rem;
        line-height: 1.5;
        white-space: normal;
      }
      .corevalues-progress {
        margin-top: 12px;
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #686880;
        text-align: center;
      }

      /* --- Shared mini-game kit (weeks 2–13) --- */
      .mg-scene { width: 100%; text-align: center; }
      .mg-title {
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        color: #ffd94a;
        margin-bottom: 12px;
      }
      .mg-main {
        min-height: 120px;
        margin-bottom: 12px;
        position: relative;
      }
      .mg-hud {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 16px;
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        margin-bottom: 8px;
      }
      .mg-flash { font-size: 0.6rem; min-width: 48px; }
      .mg-flash--hit { color: #6dff8a; }
      .mg-flash--miss { color: #ff6b6b; }
      .mg-flash--show { animation: drill-flash 0.4s ease; }
      .mg-meter-track {
        height: 10px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
        margin-bottom: 8px;
      }
      .mg-meter-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #ff6b6b 0%, #ffd94a 50%, #6dff8a 100%);
        transition: width 0.1s linear;
      }
      .mg-hint {
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        color: #9898b0;
        line-height: 1.5;
      }
      .mg-prompt {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        color: #e8e8f0;
        margin-bottom: 12px;
      }
      .mg-key-hint, .mg-wind {
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        color: #9898b0;
      }
      .mg-key-hint kbd, .mg-wind kbd {
        background: #282840;
        border: 2px solid var(--panel-border);
        padding: 2px 6px;
      }
      .mg-choices, .mg-seq-btns {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .mg-choice, .mg-seq-btn {
        text-align: left;
        font-size: 0.5rem;
        line-height: 1.4;
        white-space: normal;
      }
      .mg-aim-ring {
        position: relative;
        width: 200px;
        height: 200px;
        margin: 0 auto;
        border: 3px solid #6dff8a;
        border-radius: 50%;
        background: radial-gradient(circle, #1a3020 30%, #0e1a10 70%);
      }
      .mg-reticle {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #ff6b6b;
        border: 2px solid #fff;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        top: 50%;
        left: 50%;
      }
      .mg-log-lane {
        display: flex;
        justify-content: space-around;
        align-items: flex-end;
        height: 80px;
        background: #3d3020;
        border: 2px solid var(--panel-border);
        margin-bottom: 8px;
      }
      .mg-log-marker {
        width: 20px;
        height: 20px;
        background: #8b6914;
        border: 2px solid #5a4510;
        transition: height 0.05s linear;
      }
      .mg-log-zone {
        height: 8px;
        background: #6dff8a;
        opacity: 0.4;
        margin-top: 4px;
      }
      .mg-inspect-board {
        position: relative;
        width: 100%;
        height: 160px;
        background: linear-gradient(180deg, #2a2a48 0%, #1e1e32 100%);
        border: 3px solid var(--panel-border);
      }
      .mg-inspect-spot {
        position: absolute;
        width: 24px;
        height: 24px;
        background: transparent;
        border: 2px dashed transparent;
        cursor: pointer;
        transform: translate(-50%, -50%);
      }
      .mg-inspect-spot:hover { border-color: #ffd94a; }
      .mg-inspect-found {
        background: rgba(109, 255, 138, 0.3);
        border-color: #6dff8a;
        cursor: default;
      }
      .mg-night-bar, .mg-hike-bar {
        height: 16px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
        margin-bottom: 8px;
      }
      .mg-night-fill, .mg-hike-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3d5a80, #6dff8a);
        transition: width 0.1s linear;
      }
      .mg-flare {
        position: absolute;
        inset: 0;
        background: rgba(255, 220, 100, 0);
        pointer-events: none;
        transition: background 0.15s;
      }
      .mg-flare--on {
        background: rgba(255, 220, 100, 0.85);
      }

      /* --- Graduation ceremony --- */
      .graduation-panel { width: min(480px, 94vw); }
      .graduation-stats {
        margin: 16px 0;
        padding: 12px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }

      /* --- Mode select --- */
      .mode-panel { width: min(520px, 94vw); }
      .mode-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
      .mode-card {
        text-align: left;
        padding: 14px;
        background: #1e1e32;
        border: 3px solid var(--panel-border);
        cursor: pointer;
        font-family: var(--pixel-font);
      }
      .mode-card:hover { border-color: var(--accent); }
      .mode-card--selected { border-color: #ffd94a; background: #2a2a40; }
      .mode-card-title { display: block; font-size: 0.65rem; color: #ffd94a; margin-bottom: 6px; }
      .mode-card-desc { display: block; font-size: 0.45rem; color: #9898b0; line-height: 1.5; }
      .perk-stat-row { display: flex; flex-wrap: wrap; gap: 6px; }
      .perk-stat-btn { font-size: 0.45rem; padding: 6px 10px; }
      .perk-stat-btn--selected { border-color: #ffd94a; color: #ffd94a; }
      .mode-badge-label { color: #9898b0; margin-top: -8px; }

      /* --- Slot badges & grit --- */
      .slot-grit {
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        color: #9898b0;
        margin-bottom: 12px;
        text-align: center;
      }
      .slot-footer-actions { display: flex; justify-content: center; margin: 12px 0; }
      .slot-badge {
        font-size: 0.4rem;
        padding: 2px 5px;
        border: 1px solid var(--panel-border);
        margin-left: 6px;
      }
      .slot-badge--ironman { color: #ff6b6b; background: #301a1a; }
      .slot-badge--sandbox { color: #6db8e8; background: #1a2a3a; }
      .slot-badge--campaign { color: #c8a84a; background: #2a2410; }
      .slot-badge--available { color: #6de88a; background: #1a3020; }
      .slot-badge--locked { color: #9898b0; background: #1a1a24; }

      .campaign-panel { width: min(520px, 94vw); }
      .campaign-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin: 16px 0;
        max-height: 60vh;
        overflow-y: auto;
      }
      .campaign-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
        padding: 12px 14px;
        background: var(--panel-bg);
        border: 2px solid var(--panel-border);
        color: var(--text);
        font-family: var(--pixel-font);
        cursor: pointer;
        text-align: left;
      }
      .campaign-card:hover:not(:disabled),
      .campaign-card:focus:not(:disabled) {
        border-color: var(--accent);
        outline: none;
      }
      .campaign-card--focused {
        border-color: var(--accent);
        box-shadow: 0 0 0 1px var(--accent);
      }
      .campaign-card--locked {
        opacity: 0.55;
        cursor: not-allowed;
      }
      .campaign-card-title {
        font-size: 0.55rem;
        color: #ffd94a;
      }
      .campaign-card-subtitle {
        font-size: 0.45rem;
        color: #9898b0;
      }
      .mg-prompt--hostile { color: #ff6b6b; }
      .mg-prompt--friendly { color: #6de88a; }
      .mg-mortar-grid {
        font-family: var(--pixel-font);
        font-size: 0.45rem;
        line-height: 1.8;
        margin: 12px 0;
      }

      /* --- Locker shop --- */
      .locker-panel { width: min(480px, 94vw); }
      .locker-grit-balance {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        margin-bottom: 16px;
        text-align: center;
      }
      .locker-perk-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
      .locker-perk {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px;
        background: #1e1e32;
        border: 2px solid var(--panel-border);
      }
      .locker-perk--owned { opacity: 0.7; }
      .locker-perk-info { flex: 1; }
      .locker-perk-name { display: block; font-family: var(--pixel-font); font-size: 0.55rem; color: #e8e8f0; }
      .locker-perk-desc { display: block; font-family: var(--pixel-font); font-size: 0.4rem; color: #9898b0; margin-top: 4px; }
      .locker-owned-badge { font-family: var(--pixel-font); font-size: 0.45rem; color: #6dff8a; }
      .locker-buy-btn { font-size: 0.45rem; white-space: nowrap; }

      /* --- Hydration HUD --- */
      .recruit-hydration {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
      }
      .recruit-hydration-label {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #6db8e8;
        min-width: 32px;
      }
      .recruit-hydration-track {
        flex: 1;
        height: 8px;
        background: #1e1e32;
        border: 1px solid var(--panel-border);
      }
      .recruit-hydration-fill {
        height: 100%;
        background: linear-gradient(90deg, #3d6b8a, #6db8e8);
        transition: width 0.2s linear;
      }
      .recruit-hydration-value {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #9898b0;
        min-width: 28px;
        text-align: right;
      }
      .recruit-mode-badge {
        font-size: 0.4rem;
        padding: 1px 4px;
        border: 1px solid var(--panel-border);
        vertical-align: middle;
      }
      .recruit-mode-badge--ironman { color: #ff6b6b; }
      .recruit-mode-badge--sandbox { color: #6db8e8; }
      .recruit-token-badge {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #ffd94a;
        margin-left: 4px;
      }

      /* --- Run end / ironman --- */
      .runend-panel { width: min(460px, 94vw); }

      /* --- Sandbox prompt --- */
      .sandbox-prompt { flex-direction: column; align-items: stretch; }
      .sandbox-activity-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: center;
      }
      .sandbox-activity-btns .activity-prompt-btn { font-size: 0.45rem; }
      .mg-countdown {
        font-family: var(--pixel-font);
        font-size: 1.2rem;
        color: #ff6b6b;
        margin: 8px 0;
      }
    </style>
</head>
<body>
    <script type="module" src="/src/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8-bit Bootcamp 2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
      :root {
        --pixel-font: 'Press Start 2P', monospace;
        --panel-bg: #1e1e32;
        --panel-border: #0a0a14;
        --accent: #6a8cff;
      }
      html, body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f0f1a;
        color: #e8e8f0;
      }
      canvas { display: block; }

      /* Game canvas renders at low internal resolution and upscales with hard pixels */
      .game-canvas {
        width: 100vw !important;
        height: 100vh !important;
        image-rendering: pixelated;
      }

      .menu-overlay {
        position: fixed;
        inset: 0;
        background: rgba(8, 8, 20, 0.95);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
      }

      .menu-panel {
        background: var(--panel-bg);
        border: 4px solid var(--panel-border);
        box-shadow: 0 0 0 4px #3d3d5c, 8px 8px 0 rgba(0, 0, 0, 0.5);
        padding: 24px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .menu-title {
        margin: 0 0 12px;
        font-family: var(--pixel-font);
        font-size: 1.1rem;
        line-height: 1.5;
        letter-spacing: 0.02em;
        text-align: center;
        color: #ffd94a;
        text-shadow: 3px 3px 0 #000;
      }

      .menu-subtitle {
        margin: 0 0 20px;
        text-align: center;
        color: #9898b0;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.6;
      }

      .menu-hint {
        margin: 16px 0 0;
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        line-height: 1.6;
        color: #686880;
        text-align: center;
      }

      .slot-panel { width: min(420px, 92vw); }

      .slot-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .slot-row {
        display: flex;
        align-items: stretch;
        gap: 10px;
      }

      .slot-row--focused .slot-card {
        border-color: var(--accent);
      }

      .slot-card {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        flex: 1;
        padding: 14px 16px;
        background: #282840;
        border: 3px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
        color: inherit;
        cursor: pointer;
        text-align: left;
        font: inherit;
      }

      .slot-card:hover,
      .slot-card:focus {
        border-color: var(--accent);
        outline: none;
      }

      .slot-reset-btn {
        align-self: center;
        flex-shrink: 0;
        padding: 10px 12px;
        font-size: 0.5rem;
      }

      .slot-card--empty .slot-name { color: #9898b0; }

      .slot-label { font-family: var(--pixel-font); font-size: 0.5rem; color: #686880; text-transform: uppercase; }
      .slot-name { font-family: var(--pixel-font); font-size: 0.75rem; line-height: 1.4; }
      .slot-meta { font-size: 0.85rem; color: #9898b0; }

      .builder-panel {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 24px;
        width: min(820px, 96vw);
        max-height: 92vh;
      }

      .builder-preview {
        background: #12122a;
        border: 3px solid var(--panel-border);
        min-height: 320px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .builder-preview canvas { image-rendering: pixelated; }

      .builder-form { min-width: 0; }

      .builder-form h2 {
        margin-top: 0;
        text-align: left;
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        color: #ffd94a;
        text-shadow: 2px 2px 0 #000;
      }

      .field {
        display: block;
        margin-bottom: 14px;
        border: none;
        padding: 0;
      }

      .field > span:first-child,
      .field legend {
        display: block;
        font-size: 0.8rem;
        color: #9898b0;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .field legend { margin-bottom: 8px; }

      .field label { margin-right: 12px; cursor: pointer; }

      .name-row { display: flex; gap: 8px; }
      .name-row input { flex: 1; }

      input[type="text"],
      input[type="range"] { width: 100%; }

      input[type="text"] {
        padding: 8px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: inherit;
        font: inherit;
      }

      input[type="text"]:focus { border-color: var(--accent); outline: none; }

      .field-error {
        display: block;
        color: #ff6b6b;
        font-size: 0.8rem;
        min-height: 1.2em;
        margin-top: 4px;
      }

      .swatch-row, .outfit-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .swatch {
        width: 28px;
        height: 28px;
        border: 3px solid var(--panel-border);
        cursor: pointer;
        padding: 0;
      }

      .swatch--selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

      .background-list { display: flex; flex-direction: column; gap: 6px; }

      .background-option {
        display: block;
        padding: 8px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        cursor: pointer;
      }

      .background-option--selected { border-color: var(--accent); }

      .background-option input { margin-right: 8px; }

      .background-name { font-weight: 600; display: block; }
      .background-desc { font-size: 0.85rem; color: #9898b0; display: block; margin-top: 2px; }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
      }

      .stat-toolbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .stat-meta {
        font-family: var(--pixel-font);
        font-size: 0.5rem;
        color: #9898b0;
      }

      .stat-meta--points { color: #ffd94a; }

      .stat-hint {
        margin: 0 0 10px;
        font-size: 0.75rem;
        color: #686880;
        line-height: 1.4;
      }

      .btn-compact {
        padding: 8px 12px;
        font-size: 0.5rem;
      }

      .stat-row {
        background: #282840;
        padding: 6px 4px;
        border: 2px solid var(--panel-border);
        text-align: center;
        cursor: help;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .stat--str { border-color: var(--accent); }

      .stat-label { display: block; font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; }

      .stat-controls {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .stat-btn {
        width: 22px;
        height: 22px;
        padding: 0;
        border: 2px solid var(--panel-border);
        background: #1e1e32;
        color: #e8e8f0;
        font-family: var(--pixel-font);
        font-size: 0.65rem;
        line-height: 1;
        cursor: pointer;
      }

      .stat-btn:hover:not(:disabled) { border-color: var(--accent); background: #323258; }
      .stat-btn:disabled { opacity: 0.35; cursor: not-allowed; }

      .stat-value {
        display: block;
        font-family: var(--pixel-font);
        font-size: 0.85rem;
        min-width: 1.4em;
        text-align: center;
      }

      .stat-bg-mod {
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #6a8cff;
      }

      .hint { font-size: 0.7rem; color: #686880; text-transform: none; font-weight: normal; }

      .outfit-btn {
        padding: 6px 10px;
        background: #282840;
        border: 2px solid var(--panel-border);
        color: inherit;
        cursor: pointer;
        font-size: 0.8rem;
      }

      .outfit-btn--selected { border-color: var(--accent); background: #323258; }

      .builder-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .btn {
        padding: 12px 16px;
        border: 3px solid var(--panel-border);
        box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
        cursor: pointer;
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        line-height: 1.4;
      }

      .btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: none; }

      .btn:disabled { opacity: 0.4; cursor: not-allowed; }

      .btn-primary { background: #4a6cff; color: #fff; flex: 1; }
      .btn-primary:hover:not(:disabled) { background: #5a7cff; }

      .btn-secondary { background: #3d3d5c; color: #e8e8f0; }
      .btn-secondary:hover { background: #4d4d6c; }

      .btn-danger { background: #c0392b; color: #fff; }
      .btn-danger:hover { background: #e74c3c; }

      .confirm-overlay { z-index: 10001; }

      .confirm-box {
        background: var(--panel-bg);
        border: 4px solid var(--panel-border);
        box-shadow: 0 0 0 4px #3d3d5c, 8px 8px 0 rgba(0, 0, 0, 0.5);
        padding: 24px;
        max-width: 360px;
        text-align: center;
      }

      .confirm-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

      .recruit-hud {
        position: fixed;
        top: 12px;
        left: 12px;
        background: rgba(20, 20, 40, 0.92);
        border: 3px solid var(--panel-border);
        box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.4);
        padding: 10px 14px;
        z-index: 9999;
        min-width: 190px;
      }

      .recruit-hud-name {
        font-family: var(--pixel-font);
        font-size: 0.7rem;
        line-height: 1.4;
        color: #ffd94a;
        margin-bottom: 4px;
      }
      .recruit-hud-meta { font-family: var(--pixel-font); font-size: 0.45rem; color: #9898b0; margin-bottom: 8px; }

      .recruit-hud-stats {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 4px;
      }

      .recruit-stat {
        text-align: center;
        cursor: help;
        padding: 3px 4px;
        background: rgba(40, 40, 64, 0.9);
        border: 2px solid var(--panel-border);
      }

      .recruit-stat-label { display: block; font-family: var(--pixel-font); font-size: 0.4rem; color: #9898b0; }
      .recruit-stat-value { display: block; font-family: var(--pixel-font); font-size: 0.6rem; margin-top: 3px; }

      .location-hud {
        position: fixed;
        bottom: 8px;
        left: 8px;
        color: #cfcfe0;
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        line-height: 1.5;
        background: rgba(20, 20, 40, 0.85);
        border: 2px solid var(--panel-border);
        padding: 6px 10px;
        z-index: 9999;
      }

      .recruiter-panel { width: min(520px, 94vw); }
      .recruiter-panel--asvab { width: min(720px, 96vw); }
      .recruiter-panel--station { width: min(720px, 96vw); }

      .recruiter-body { margin: 16px 0; min-height: 120px; }
      .recruiter-panel--asvab .recruiter-body { min-height: 280px; }
      .recruiter-panel--station .recruiter-body { min-height: 320px; }

      .recruiter-actions { display: flex; gap: 10px; justify-content: center; }

      .recruiter-copy { margin: 0 0 12px; line-height: 1.5; color: #cfcfe0; }
      .recruiter-copy--small { font-size: 0.8rem; color: #9898b0; }

      .recruiter-checklist {
        margin: 0 0 16px;
        padding-left: 20px;
        color: #cfcfe0;
        line-height: 1.6;
      }

      .asvab-question {
        font-size: 0.9rem;
        line-height: 1.45;
        margin: 0 0 12px;
        color: #2a2a32;
        font-family: 'Courier New', Courier, monospace;
      }

      .asvab-choices {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .asvab-choice {
        text-align: left;
        width: 100%;
      }

      /* --- ASVAB folding-table scene --- */
      .asvab-scene { width: 100%; }

      .asvab-room {
        display: grid;
        grid-template-columns: 1fr 130px;
        gap: 8px;
        align-items: end;
        background: linear-gradient(180deg, #9aa0a8 0%, #7a8088 100%);
        border: 3px solid var(--panel-border);
        padding: 12px 12px 0;
        min-height: 260px;
        image-rendering: pixelated;
      }

      .asvab-table-unit {
        position: relative;
        padding-bottom: 8px;
      }

      .folding-table {
        position: relative;
        margin-bottom: -4px;
      }

      .folding-table-top {
        height: 10px;
        background: #6e757d;
        border: 2px solid #4a5058;
        box-shadow: inset 0 2px 0 #8a929a;
      }

      .folding-table-legs {
        display: flex;
        justify-content: space-between;
        padding: 0 18px;
      }

      .folding-leg {
        display: block;
        width: 4px;
        height: 52px;
        background: #5a6068;
        border: 1px solid #3a4048;
      }

      .asvab-paper {
        position: relative;
        background: #f2ecd8;
        border: 2px solid #c8bfa8;
        box-shadow: 2px 2px 0 #8a8070, inset 0 0 0 1px #fff8e8;
        padding: 10px 12px 8px;
        margin-top: 0;
        min-height: 180px;
        transform: rotate(-0.4deg);
      }

      .asvab-paper-header {
        display: flex;
        justify-content: space-between;
        font-family: var(--pixel-font);
        font-size: 0.4rem;
        color: #5a5040;
        border-bottom: 2px dashed #c0b898;
        padding-bottom: 6px;
        margin-bottom: 10px;
      }

      .asvab-paper-footer {
        margin: 10px 0 0;
        font-size: 0.65rem;
        color: #8a7060;
        font-style: italic;
      }

      .asvab-bubbles {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .asvab-bubble {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 5px 6px;
        border: none;
        background: transparent;
        cursor: pointer;
        text-align: left;
        color: #2a2a32;
        font-family: 'Courier New', Courier, monospace;
        font-size: 0.85rem;
      }

      .asvab-bubble:hover { background: rgba(200, 80, 60, 0.08); }

      .asvab-bubble-mark {
        width: 14px;
        height: 14px;
        border: 2px solid #3a3530;
        border-radius: 50%;
        flex-shrink: 0;
        background: #f2ecd8;
      }

      .asvab-bubble--filled .asvab-bubble-mark {
        background: #c84838;
        box-shadow: inset 0 0 0 2px #a03028;
      }

      .asvab-bubble-letter {
        font-weight: 700;
        min-width: 1.2em;
      }

      .asvab-crayon {
        position: absolute;
        right: 12px;
        bottom: 18px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        transform: rotate(12deg);
        pointer-events: none;
      }

      .asvab-crayon-body {
        display: block;
        width: 10px;
        height: 36px;
        background: linear-gradient(90deg, #a83828 0%, #d05040 40%, #a83828 100%);
        border: 1px solid #782018;
        clip-path: polygon(15% 0, 85% 0, 100% 100%, 0 100%);
      }

      .asvab-crayon-label {
        font-family: var(--pixel-font);
        font-size: 0.35rem;
        color: #5a4040;
        letter-spacing: 0.05em;
      }

      .asvab-recruit-seat {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        padding-bottom: 4px;
      }

      .asvab-chair-back {
        width: 52px;
        height: 28px;
        background: #4a5058;
        border: 2px solid #2a3038;
        margin-bottom: -6px;
        z-index: 0;
      }

      .asvab-recruit-slot {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        min-height: 160px;
      }

      .asvab-recruit-slot canvas {
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.35));
      }

      /* --- NCO recruiting station scene --- */
      .station-scene { width: 100%; }

      .station-room {
        position: relative;
        height: 200px;
        background: linear-gradient(180deg, #c8ccd4 0%, #a8acb4 55%, #8a6f47 55%, #6d5637 100%);
        border: 3px solid var(--panel-border);
        margin-bottom: 12px;
        overflow: hidden;
      }

      .station-flag {
        position: absolute;
        top: 12px;
        right: 16px;
        width: 36px;
        height: 24px;
        background: linear-gradient(180deg, #b3202e 0%, #b3202e 38%, #1c2540 38%, #1c2540 62%, #b3202e 62%);
        border: 2px solid #26261e;
      }

      .station-desk {
        position: absolute;
        bottom: 28px;
        left: 16px;
        width: 80px;
        height: 8px;
        background: #6d5637;
        border: 2px solid #4a3826;
        box-shadow: 0 8px 0 #5a4632;
      }

      .station-nco {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        justify-content: center;
        align-items: flex-end;
        height: 100%;
        padding-bottom: 4px;
      }

      .station-nco-sprite {
        image-rendering: pixelated;
        height: auto;
        filter: drop-shadow(3px 3px 0 rgba(0, 0, 0, 0.35));
      }

      .nco-dialogue {
        background: #282840;
        border: 3px solid var(--panel-border);
        padding: 12px 14px;
        min-height: 100px;
      }

      .nco-nameplate {
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        margin-bottom: 8px;
      }

      .nco-text {
        margin: 0 0 12px;
        line-height: 1.5;
        color: #e8e8f0;
        font-size: 0.9rem;
        min-height: 2.8em;
      }

      .nco-choices {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 10px;
      }

      .nco-choice {
        text-align: left;
        width: 100%;
        font-size: 0.75rem;
        line-height: 1.4;
      }

      .nco-actions {
        display: flex;
        justify-content: flex-end;
      }

      .nco-continue {
        font-size: 0.55rem;
        padding: 10px 16px;
      }

      .recruiter-results {
        background: #282840;
        border: 2px solid var(--panel-border);
        padding: 14px;
      }

      .recruiter-result-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }

      .recruiter-final-stats {
        margin-top: 12px;
        padding-top: 12px;
        border-top: 2px solid var(--panel-border);
        font-family: var(--pixel-font);
        font-size: 0.55rem;
        color: #ffd94a;
        text-align: center;
      }

      .stat-delta { font-family: var(--pixel-font); font-size: 0.55rem; }
      .stat-delta--up { color: #6dff8a; }
      .stat-delta--down { color: #ff6b6b; }

      /* --- Pull-up bar station scene --- */
      .recruiter-panel--pullup { width: min(720px, 96vw); }
      .recruiter-panel--pullup .recruiter-body { min-height: 300px; }

      .pullup-scene { width: 100%; }

      .pullup-yard {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 48px;
        background: linear-gradient(180deg, #8fa9c8 0%, #9fb26a 55%, #7a8f4a 100%);
        border: 3px solid var(--panel-border);
        padding: 20px 24px 0;
        height: 230px;
        image-rendering: pixelated;
      }

      .pullup-station {
        position: relative;
        width: 96px;
        height: 100%;
      }

      /* Horizontal pull-up bar */
      .pullup-bar {
        position: absolute;
        top: 24px;
        left: -6px;
        right: -6px;
        height: 6px;
        background: #d0d0d8;
        border: 2px solid #2a2a32;
        z-index: 3;
      }

      /* 4x4 timber posts */
      .pullup-post {
        position: absolute;
        top: 24px;
        bottom: 0;
        width: 12px;
        background: linear-gradient(90deg, #8a6f47 0%, #a8894f 45%, #6d5637 100%);
        border: 2px solid #4a3826;
        z-index: 2;
      }

      .pullup-post--left { left: 0; }
      .pullup-post--right { right: 0; }

      .pullup-recruit-slot {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        display: flex;
        align-items: flex-start;
        justify-content: center;
      }

      .pullup-recruit-slot canvas {
        filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.3));
      }

      .pullup-timing-flash {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        font-family: var(--pixel-font);
        font-size: 0.6rem;
        opacity: 0;
        pointer-events: none;
        z-index: 5;
      }

      .pullup-timing-flash--show { opacity: 1; }
      .pullup-timing-flash--perfect { color: #6dff8a; text-shadow: 2px 2px 0 #000; }
      .pullup-timing-flash--miss { color: #ff6b6b; text-shadow: 2px 2px 0 #000; }

      .pullup-hud {
        padding: 12px 4px 0;
      }

      .pullup-hud-row {
        display: flex;

# 8-bit Bootcamp - static Vite PWA
# Deploy: copy the contents of dist/ to the root below, then
#   sudo cp nginx.conf /etc/nginx/sites-available/8-bit-bootcamp
#   sudo ln -s /etc/nginx/sites-available/8-bit-bootcamp /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 8bitdiv.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 8bitdiv.net www.8bitdiv.net;

    ssl_certificate     /etc/letsencrypt/live/8bitdiv.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/8bitdiv.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /root/8-bit-bootcamp/dist;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # Service worker and its manifest must never be cached, or PWA updates stall.
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* ^/(sw\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Vite content-hashed bundles are safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        try_files $uri =404;
    }

    location ~* \.(png|ico|jpg|jpeg|gif|webp|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    # SPA fallback, matching the Workbox navigateFallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
